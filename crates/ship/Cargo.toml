# The ship designer and the game it starts: `Session`, which is the design
# phase and then the world, with the cameras and the painters that turn
# either into a buffer of shapes for `crates/app` to draw.
#
# The rules live next door in `shipdesign` and `world`, which render nothing
# and can be compiled by a native server. What is here is everything that is
# only true of a screen: a camera, a pointer, a ghost under it, and shapes.
[package]
name = "ship"
version = "0.1.0"
edition = "2024"
description = "The ship design phase and the game it starts — the session, the cameras and the painters"

[dependencies]
bims = { path = "../game" }
economy = { path = "../economy" }
flight = { path = "../flight" }
physics = { path = "../physics" }
shipdesign = { path = "../shipdesign" }
time = { path = "../time" }
world = { path = "../world", features = ["serde"] }
worldgen = { path = "../worldgen" }
# The save file: `save.rs` writes a world out as RON text and reads one
# back. Both are in the lock already, under Bevy.
ron = "0.12"
serde = { version = "1", features = ["derive"] }

# The world: a galaxy of stars, what is in each system, and the station
# blueprints a later map-generation step will build interiors from. Shared
# between the client — compiled to wasm — and the native server that will one
# day be authoritative, so the same seed gives both the same world.
[package]
name = "worldgen"
version = "0.1.0"
edition = "2024"
description = "Seeded galaxy, system contents and station blueprints"

[dependencies]
physics = { path = "../physics" }
time = { path = "../time" }
# For `economy::market::Bias`, the per-station lean on every price: rolled
# here beside the shelf, quoted from there.
economy = { path = "../economy" }
# Optional and off by default: the `serde` feature derives `Serialize` and
# `Deserialize` on every type here, which is how a save file holds one
# (`ship::save`), and turns the same feature on in the crates this one's
# types are made of.
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde", "physics/serde", "economy/serde"]

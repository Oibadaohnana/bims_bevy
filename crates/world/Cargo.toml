# The world: one star system, the ship in it, and everything aboard, all
# advancing on one clock.
#
# Pure state and pure functions. It renders nothing and exports nothing to
# wasm — `crates/ship` draws it and the page steps it — and it compiles for
# native and for wasm32 so the server that will one day be authoritative runs
# exactly this loop.
[package]
name = "world"
version = "0.1.0"
edition = "2024"
description = "The one world clock: a system, a ship, and what happens on it"

[dependencies]
bims = { path = "../game" }
economy = { path = "../economy" }
flight = { path = "../flight" }
health = { path = "../health" }
physics = { path = "../physics" }
shipdesign = { path = "../shipdesign" }
time = { path = "../time" }
worldgen = { path = "../worldgen" }
# Optional and off by default: the `serde` feature derives `Serialize` and
# `Deserialize` on every type here, which is how a save file holds one
# (`ship::save`), and turns the same feature on in the crates this one's
# types are made of.
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde", "bims/serde", "economy/serde", "flight/serde", "health/serde", "physics/serde", "shipdesign/serde", "worldgen/serde"]

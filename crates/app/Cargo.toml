# The game, as a window on a desk.
#
# The one binary in the workspace, and the one crate that knows what a
# window, a pointer or a frame is. Everything it shows it gets from the
# crates beside it as numbers and shapes — the room, the designer and the
# lobby each build a list of rectangles and ellipses, and this crate turns
# the list into a mesh and puts the words on top. The panels are egui.
[package]
name = "app"
version = "0.1.0"
edition = "2024"
description = "Bims — the desktop game: a Bevy window over the room, the designer, the lobby and the world"

[[bin]]
name = "bims"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true, features = [
    "default_app",
    "2d_bevy_render",
    "bevy_audio",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "png",
    "std",
    "vorbis",
    "wayland",
    "x11",
] }
bevy_egui = { workspace = true }
bims = { path = "../game", features = ["serde"] }
economy = { path = "../economy" }
flight = { path = "../flight", features = ["serde"] }
lobby = { path = "../lobby" }
physics = { path = "../physics", features = ["serde"] }
ship = { path = "../ship" }
shipdesign = { path = "../shipdesign", features = ["serde"] }
time = { path = "../time" }
world = { path = "../world", features = ["serde"] }
worldgen = { path = "../worldgen" }
# The wire (feature 59): the relay's protocol, and the socket to it. A
# message between players is postcard bytes the relay passes along
# untouched, encoded through `wire`. The socket runs on its own
# thread and reaches Bevy over channels, so the blocking client is the one
# wanted here — no runtime, no async colouring in the screens — under TLS,
# since the relay sits behind nginx at `wss://bims.buggly.de`: rustls with
# the Mozilla roots built in, and `ring` for its arithmetic, all pure Rust
# bar ring's C, which the nix build compiles like anything else.
wire = { path = "../wire" }
serde = { version = "1", features = ["derive"] }
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[dev-dependencies]
# The relay's rooms, with no socket: the lockstep test in `net.rs` passes
# two sessions' messages through a `Hub` in-process.
server = { path = "../server" }
